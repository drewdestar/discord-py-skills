name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.2.0 pytest-asyncio==1.4.1.post1 discord.py==2.7.1 aiosqlite==0.22.1 python-dotenv==1.2.4
      - name: Run the pack test suite
        run: python -m pytest tests/ -q
      - name: Run the starter bot test suite
        run: python -m pytest templates/starter-bot -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check every Python file
        run: |
          python -m py_compile newr scripts/*.py templates/starter-bot/*.py templates/starter-bot/cogs/*.py templates/starter-bot/tests/*.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the docs site
        working-directory: website
        run: |
          npm ci
          npm run docs:build
